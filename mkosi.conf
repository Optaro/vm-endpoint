# mkosi recipe — Huginn VM Image raw QEMU disk image.
#
# Builds a minimal Debian 12 (bookworm) rootfs with the VM Image agent baked in,
# then partitions it into a raw image suitable for libvirt/QEMU on a CentOS 6
# hypervisor. The output is `output/vm-endpoint.raw` which we ship as `.raw.xz`.
#
# Build:
#   cd vm-image && make image
#
# Required tooling on the build host:
#   apt install -y mkosi systemd-container debootstrap xz-utils

[Distribution]
Distribution=debian
Release=bookworm
Repositories=main

[Output]
ImageId=huginn-vm-endpoint
Format=disk
Output=vm-endpoint.raw
OutputDirectory=output

[Content]
Bootable=yes
Bootloader=grub
KernelCommandLine=console=ttyS0,115200 console=tty0 net.ifnames=0 biosdevname=0

# Minimum viable Debian: just enough to run Python + WireGuard + iproute2.
# net.ifnames=0 + biosdevname=0 give us predictable eth0/eth1 instead of
# enpXsY (which churns when the libvirt admin reorders virtio NICs).
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        kmod
        linux-image-amd64
        grub-pc
        wireguard-tools
        iproute2
        bridge-utils
        iputils-ping
        ca-certificates
        python3
        python3-venv
        python3-pip
        python3-cryptography
        python3-flask
        python3-requests
        less
        curl
        ssh

# Strip what we don't need to hit the <800 MB target.
RemoveFiles=
        /usr/share/doc/*
        /usr/share/man/*
        /usr/share/locale/[a-d]*
        /usr/share/locale/[f-z]*
        /var/cache/apt/archives/*.deb
        /var/lib/apt/lists/*

[Validation]
# Image is unsigned for now — checksum is published alongside on Hetzner.

[Host]
QemuMem=512M
QemuSmp=2
